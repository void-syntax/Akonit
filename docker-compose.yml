services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signal}
      POSTGRES_DB: signal_radar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signal:${POSTGRES_PASSWORD:-signal}@db:5432/signal_radar
      REDIS_URL: redis://redis:6379/0
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Without this the browser opens against an API that is still importing, and
    # the first paint shows "cannot reach the local API" instead of signals.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  # The collector. One process runs every stage (collect, match, notify,
  # metrics, cleanup) on its own schedule — there is deliberately no second
  # scheduler service, because two of them would collect twice as often and
  # double the load on the free public sources.
  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signal:${POSTGRES_PASSWORD:-signal}@db:5432/signal_radar
      REDIS_URL: redis://redis:6379/0
    command: python -m app.workers.schedule
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
