name: Collect signals

# This is what makes the radar run 24/7: GitHub runs this on a cron, so data
# keeps flowing even when no machine of ours is switched on.
on:
  schedule:
    # Every 20 minutes (cron granularity is 5 minutes, but :00 is busiest).
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Run radar matching and notifications too"
        type: boolean
        default: true

concurrency:
  group: collect-signals
  cancel-in-progress: false

jobs:
  collect:
    name: Collect, detect, match, notify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Resolve SECRET_KEY
        # Falls back to a per-run random value when the repo secret is absent,
        # so collection works even before the secret is configured. Nothing
        # signed in a short-lived run is reused elsewhere.
        run: |
          if [ -n "${{ secrets.SECRET_KEY }}" ]; then
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> "$GITHUB_ENV"
          else
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
            echo "::warning::SECRET_KEY secret not set, using a per-run value"
          fi

      # No separate `alembic upgrade head` step: the tools call _bootstrap.prepare(),
      # which stamps the baseline when the Supabase schema already exists and then
      # upgrades. A bare upgrade would fail on CREATE TABLE for existing tables.
      - name: Seed reference data
        run: python -m tools.seed_reference
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Collect cycle
        run: python -m tools.collect_once
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ""
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          COLLECT_INTERVAL_SECONDS: "900"

      - name: Match radars and deliver notifications
        if: ${{ inputs.full == false || github.event_name == 'schedule' }}
        run: python -m tools.notify_once
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      - name: Summary
        if: always()
        run: echo "collection cycle finished"